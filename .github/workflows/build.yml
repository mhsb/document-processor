name: Build Document Processor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger

jobs:
  build-windows:
    strategy:
      matrix:
        include:
          - name: "32-bit"
            python-version: "3.8"
            architecture: "x86"
            output-name: "DocumentProcessor-32bit.exe"
          - name: "64-bit"
            python-version: "3.8"
            architecture: "x64"
            output-name: "DocumentProcessor-64bit.exe"
    
    runs-on: windows-latest
    name: Build Windows ${{ matrix.name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }} (${{ matrix.architecture }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.2.0
          pip install pywin32==306
      
      - name: Create main.py if it doesn't exist
        run: |
          # If main.py is in a different location, adjust this
          if not exist "main.py" (
            echo "Creating main.py from script..."
            # PASTE YOUR PYTHON SCRIPT HERE or copy from file
            copy src\main.py . 2>nul || echo "No src/main.py found"
          )
      
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile ^
            --name "DocumentProcessor" ^
            --hidden-import win32timezone ^
            --hidden-import win32com ^
            --hidden-import pythoncom ^
            --collect-all pywin32 ^
            --clean ^
            main.py
      
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output-name }}
          path: dist/DocumentProcessor.exe
          retention-days: 7
