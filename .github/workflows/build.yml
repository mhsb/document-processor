name: Build Executable

on:
  push:  # Runs when you push code
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-windows-32bit:
    runs-on: windows-latest
    name: Build Windows 32-bit
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python 3.8 (32-bit)
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          architecture: 'x86'  # 32-bit!
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build executable
        run: |
          cd src
          pyinstaller --onefile --name DocumentProcessor main.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: DocumentProcessor-Windows-32bit
          path: src/dist/DocumentProcessor.exe
          if-no-files-found: error

  build-windows-64bit:
    runs-on: windows-latest
    name: Build Windows 64-bit
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python 3.8 (64-bit)
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          architecture: 'x64'  # 64-bit
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build executable
        run: |
          cd src
          pyinstaller --onefile --name DocumentProcessor64 main.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: DocumentProcessor-Windows-64bit
          path: src/dist/DocumentProcessor64.exe
